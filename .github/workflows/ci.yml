name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             g++             libssl-dev             libsodium-dev             ninja-build             python3-venv

      - name: Install CMake 3.31
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install "cmake>=3.31,<3.32"
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          .ci-venv/bin/cmake --version

      - name: Configure
        run: |
          cmake             -S .             -B build             -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
